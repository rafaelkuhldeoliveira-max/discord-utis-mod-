name: Oraculo X - verificacoes
on:
  push:
    paths:
      - 'discordutils-plus/**'
      - 'discordutils-global/**'
      - 'test/**'
      - 'coleira-bot/**'
      - 'vencord-userplugin/**'
      - '.github/workflows/oraculo-x-check.yml'
  pull_request:
    paths:
      - 'discordutils-plus/**'
      - 'discordutils-global/**'
      - 'test/**'
      - 'coleira-bot/**'
      - 'vencord-userplugin/**'
jobs:
  syntax-and-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar JavaScript do complemento e da ponte
        run: |
          node --check discordutils-plus/addon.js
          node --check discordutils-global/inject.js
          node --check discordutils-global/renderer.js
          node --check test/oraculo-x.test.cjs
          node --check coleira-bot/src/index.js
      - name: Testar voz, vinculo por ID, checksums e consentimento
        run: node --test test/oraculo-x.test.cjs coleira-bot/test/policy.test.js
