name: Oraculo X - verificacoes
on:
  push:
    paths:
      - 'discordutils-plus/**'
      - 'discordutils-global/**'
      - 'test/**'
      - 'coleira-bot/**'
      - 'vencord-userplugin/**'
      - '.github/workflows/oraculo-x-check.yml'
  pull_request:
    paths:
      - 'discordutils-plus/**'
      - 'discordutils-global/**'
      - 'test/**'
      - 'coleira-bot/**'
      - 'vencord-userplugin/**'
jobs:
  syntax-and-consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar JavaScript do complemento e da ponte
        run: |
          node --check discordutils-plus/addon.js
          node --check discordutils-global/inject.js
          node --check discordutils-global/renderer.js
          node --check test/oraculo-x.test.cjs
          node --check coleira-bot/src/index.js
      - name: Validar sintaxe do instalador PowerShell sem executar instalacao
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('discordutils-plus/instalador-gui.ps1', [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verificar hashes dos dois modulos instalados
        run: sha256sum discordutils-global/renderer.js discordutils-global/inject.js
      - name: Testar voz, vinculo por ID, checksums e consentimento
        run: node --test test/oraculo-x.test.cjs coleira-bot/test/policy.test.js
